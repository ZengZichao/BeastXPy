# BeastXPy example: tip-dated analysis (Birth-Death + HKY + UCLN, no node
# calibrations -- the time axis comes from sampling dates at the tips).
metadata:
  analysis_name: tip_dates

alignments:
  - id: alignment1
    file: primates.fasta
    data_type: nucleotide

tip_dates:
  Homo_sapiens: {value: 0.0, direction: forwards, units: years}
  Pan: {value: 0.0, direction: forwards, units: years}
  Gorilla: {value: 0.0, direction: forwards, units: years}
  Pongo: {value: 0.0, direction: forwards, units: years}
  Hylobates: {value: 0.0, direction: forwards, units: years}
  Macaca_fuscata: {value: 2.0, direction: backwards, units: years}
  M_mulatta: {value: 2.0, direction: backwards, units: years}
  M_fascicularis: {value: 3.0, direction: backwards, units: years}
  M_sylvanus: {value: 5.0, direction: backwards, units: years}
  Saimiri_sciureus: {value: 5.0, direction: backwards, units: years}
  Tarsius_syrichta: {value: 10.0, direction: backwards, units: years}
  Lemur_catta: {value: 8.0, direction: backwards, units: years}

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: estimated}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0, estimate: true}
    clock_model:
      type: ucln
      ucld_mean: {value: 0.01, lower: 0.0, estimate: true}
      ucld_stdev: {value: 0.2, lower: 0.0, estimate: true}

tree_prior:
  type: birth_death
  birth_minus_death: {value: 0.5, lower: 0.0, estimate: true}
  relative_death: {value: 0.5, lower: 0.0, estimate: true}

mcmc:
  chain_length: 1000000

loggers:
  trace_log: {file_name: tip_dates.log, log_every: 1000}
  tree_log: {file_name: tip_dates.trees, log_every: 1000}

control:
  beast_version: 1.10.4
