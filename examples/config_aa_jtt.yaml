# BeastXPy example: amino-acid JTT + G4 + I + strict clock.
metadata:
  analysis_name: aa_jtt

alignments:
  - id: alignment1
    file: aminoacid.fasta
    data_type: amino-acid

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: jtt
        frequencies: {mode: empirical}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0, estimate: true}
      proportion_invariant: {value: 0.1, lower: 0.0, upper: 1.0, estimate: true}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, estimate: true}

calibrations:
  - name: "Hominidae"
    taxa: [Pan_troglodytes, Gorilla_gorilla, Pongo_pygmaeus]
    monophyletic: true
    distribution:
      type: lognormal
      parameters: {mean: 1.0, stdev: 0.5}
      offset: 15.0
    provenance:
      source: fossil
      calibration_type: soft
      original_age_min: 15.0
      original_age_max: 20.0

mcmc:
  chain_length: 1000000

loggers:
  trace_log: {file_name: aa_jtt.log, log_every: 1000}
  tree_log: {file_name: aa_jtt.trees, log_every: 1000}

control:
  beast_version: 1.10.4
