# BeastXPy coverage fixture C05: sequence error (aDNA damage) model.
# A constant per-site damage probability is estimated jointly with the tree;
# the model is attached to the single core tree likelihood as BEAUti does.
metadata:
  analysis_name: cov_sequence_error
  author: BeastXPy coverage fixtures

alignments:
  - id: nuc
    file: nuc.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: nuc
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: empirical}
    clock_model:
      type: strict
      clock_rate: {value: 1.0, lower: 0.0, upper: 100.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, upper: 1000.0, estimate: true}

mcmc:
  chain_length: 20000

loggers:
  trace_log: {file_name: cov_sequence_error.log, log_every: 1000}
  tree_log: {file_name: cov_sequence_error.trees, log_every: 1000}
  screen_log: {log_every: 2000}

output:
  file: cov_sequence_error.xml

control:
  beast_version: 1.10.4
  seed: 20240602

analysis:
  beast_version: both
  type: sequence_error
  error_type: all
  base_error_rate: 0.02
  estimate: true
  partition: 1
