# BeastXPy coverage fixture C04: marginal likelihood (path sampling + stepping stone).
# The alignment is the bundled 5-taxon / 60-site nucleotide matrix.  The MLE
# block re-uses the standard MCMC chain as its sampler; chain lengths are small
# so the fixture is cheap to instantiate and to run.
metadata:
  analysis_name: cov_mle
  author: BeastXPy coverage fixtures

alignments:
  - id: nuc
    file: nuc.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: nuc
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: empirical}
    clock_model:
      type: strict
      clock_rate: {value: 1.0, lower: 0.0, upper: 100.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, upper: 1000.0, estimate: true}

mcmc:
  chain_length: 20000

loggers:
  trace_log: {file_name: cov_mle.log, log_every: 1000}
  tree_log: {file_name: cov_mle.trees, log_every: 1000}
  screen_log: {log_every: 2000}

output:
  file: cov_mle.xml

control:
  beast_version: 1.10.4
  seed: 20240601

analysis:
  beast_version: both
  type: mle
  chain_length: 2000
  path_steps: 8
  path_scheme: oneSidedBeta
  beta: 0.3
  log_every: 100
