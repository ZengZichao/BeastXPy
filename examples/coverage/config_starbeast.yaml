# C08: minimal *BEAST (StarBEAST1) multi-species coalescent analysis.
# One gene tree (the core treeModel) is embedded in a species tree built with
# <species>/<speciesTree>/<speciesCoalescent> and the species tree gets a
# <speciationLikelihood> prior (the core Yule model repointed at the species
# tree).  Minimal supported subset: exactly one sequence per species, so the
# species tree can start from the gene tree topology and the initial
# speciesCoalescent likelihood is finite.
metadata:
  analysis_name: coverage_starbeast

alignments:
  - id: alignment1
    file: nuc.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: estimated}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, upper: 100.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, upper: 1000.0, estimate: true}

analysis:
  beast_version: both
  type: starbeast
  species:
    TaxA: TaxA
    TaxB: TaxB
    TaxC: TaxC
    TaxD: TaxD
    TaxE: TaxE
  population_size: {value: 0.01, lower: 0.0}
  node_reheight_weight: 10

mcmc:
  chain_length: 200000

loggers:
  trace_log: {file_name: coverage_starbeast.log, log_every: 1000}
  tree_log: {file_name: coverage_starbeast.trees, log_every: 1000}
  screen_log: {log_every: 10000}

control:
  beast_version: 1.10.4
