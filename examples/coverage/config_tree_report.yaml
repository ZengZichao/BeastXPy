# C09: BEAST X 10.5.0-only tree report.
# Logs the stem-branch length of a chosen MRCA clade with the 10.5.0-only
# <branchLengthStatistic> parser.  (The <reportTree> logger parser exists in
# the 10.5.0 sources but is registered only in development_parsers.properties;
# the official release jar silently ignores it, so it is not emitted.)
metadata:
  analysis_name: coverage_tree_report

alignments:
  - id: alignment1
    file: nuc.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: estimated}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, upper: 100.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, upper: 1000.0, estimate: true}

analysis:
  type: tree_report
  beast_version: "10.5.0"
  mrca_taxa: [TaxA, TaxB]
  name: stemLength

mcmc:
  chain_length: 200000

loggers:
  trace_log: {file_name: coverage_tree_report.log, log_every: 1000}
  tree_log: {file_name: coverage_tree_report.trees, log_every: 1000}
  screen_log: {log_every: 10000}

control:
  beast_version: 10.5.0
