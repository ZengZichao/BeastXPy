# BeastXPy coverage fixture C06a: Dollo (mutation/death) analysis.
# The nucleotide alignment is recoded into presence/absence of cytosine at
# variable, fully resolved sites (5 binary characters for this matrix); the
# Dollo model then estimates the loss (death) rate with gains integrated out.
metadata:
  analysis_name: cov_dollo
  author: BeastXPy coverage fixtures

alignments:
  - id: nuc
    file: nuc.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: nuc
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: empirical}
    clock_model:
      type: strict
      clock_rate: {value: 1.0, lower: 0.0, upper: 100.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, upper: 1000.0, estimate: true}

mcmc:
  chain_length: 20000

loggers:
  trace_log: {file_name: cov_dollo.log, log_every: 1000}
  tree_log: {file_name: cov_dollo.trees, log_every: 1000}
  screen_log: {log_every: 2000}

output:
  file: cov_dollo.xml

control:
  beast_version: 1.10.4
  seed: 20240603

analysis:
  beast_version: both
  type: dollo
  derived_state: C
  death_rate: 1.0
  estimate_death_rate: true
  observation: anyTip
  max_sites: 200
