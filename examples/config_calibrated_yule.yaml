# BeastXPy example: calibrated Yule with constrained starting tree + stem
# calibration + monophyly enforcement.
metadata:
  analysis_name: calibrated_yule

alignments:
  - id: alignment1
    file: primates.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, upper: 100.0, estimate: true}
        frequencies: {mode: estimated}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0, estimate: true}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, estimate: true}

calibrations:
  - name: "Catarrhini"
    taxa: [Homo_sapiens, Pan, Gorilla, Pongo, Hylobates, Macaca_fuscata, M_mulatta, M_fascicularis, M_sylvanus]
    monophyletic: true
    distribution:
      type: lognormal
      parameters: {mean: 1.0, stdev: 0.5}
      offset: 25.0
    provenance:
      source: fossil
      calibration_type: soft
      original_age_min: 25.0
      original_age_max: 30.0
  - name: "Hominoidea"
    taxa: [Homo_sapiens, Pan, Gorilla, Pongo, Hylobates]
    monophyletic: true
    distribution:
      type: lognormal
      parameters: {mean: 1.0, stdev: 0.5}
      offset: 15.0
    calibration_method: stem
    provenance:
      source: fossil
      calibration_type: soft
      original_age_min: 15.0
      original_age_max: 20.0
  - name: "Homininae"
    taxa: [Homo_sapiens, Pan, Gorilla]
    monophyletic: true
    distribution:
      type: lognormal
      parameters: {mean: 1.0, stdev: 0.5}
      offset: 7.0
    provenance:
      source: literature
      calibration_type: soft
      original_age_min: 6.0
      original_age_max: 8.0

control:
  beast_version: 1.10.4
  initial_tree: coalescent

mcmc:
  chain_length: 1000000

loggers:
  trace_log: {file_name: calibrated_yule.log, log_every: 1000}
  tree_log: {file_name: calibrated_yule.trees, log_every: 1000}
