# BeastXPy check-data fixture: empirical_tree.
metadata:
  analysis_name: dc_empirical_tree

alignments:
  - id: aln1
    file: aln.fasta
    data_type: nucleotide


partitions:
  - id: p1
    alignment_id: aln1
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}


control:
  initial_tree: newick
  newick: "((t1,t2),(t3,WRONG));"
