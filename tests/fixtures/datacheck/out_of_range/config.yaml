# BeastXPy check-data fixture: out_of_range.
metadata:
  analysis_name: dc_out_of_range

alignments:
  - id: aln1
    file: aln20.fasta
    data_type: nucleotide


partitions:
  - id: p1
    alignment_id: aln1
    from: 15
    to: 999
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

