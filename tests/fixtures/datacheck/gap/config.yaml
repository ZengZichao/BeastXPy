# BeastXPy check-data fixture: gap.
metadata:
  analysis_name: dc_gap

alignments:
  - id: aln1
    file: aln20.fasta
    data_type: nucleotide


partitions:
  - id: p1
    alignment_id: aln1
    from: 1
    to: 10
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

