# BeastXPy check-data fixture: tip_order.
metadata:
  analysis_name: dc_tip_order

alignments:
  - id: aln1
    file: aln.fasta
    data_type: nucleotide


partitions:
  - id: p1
    alignment_id: aln1
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}


tip_dates:
  t1: {value: -5.0, direction: backwards, units: years}
  t2: {value: 10.0, direction: backwards, units: years}
