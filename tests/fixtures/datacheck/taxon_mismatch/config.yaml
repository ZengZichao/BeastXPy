# BeastXPy check-data fixture: taxon_mismatch.
metadata:
  analysis_name: dc_taxon_mismatch

alignments:
  - id: aln1
    file: aln_a.fasta
    data_type: nucleotide
  - id: aln2
    file: aln_b.fasta
    data_type: nucleotide


partitions:
  - id: p1
    alignment_id: aln1
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}
  - id: p2
    alignment_id: aln2
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

