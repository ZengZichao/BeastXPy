# BeastXPy check-data fixture: codon.
metadata:
  analysis_name: dc_codon

alignments:
  - id: aln1
    file: aln.fasta
    data_type: codon


partitions:
  - id: p1
    alignment_id: aln1
    site_model:
      substitution_model:
        type: jc69
        frequencies: {mode: uniform}
    clock_model:
      type: strict
      clock_rate: {value: 0.01, lower: 0.0, estimate: true}

