# M5 reference case B: HKY + Gamma + UCLN + one fossil calibration.
metadata:
  analysis_name: beauti_ref_hky_gamma_ucln

alignments:
  - id: alignment1
    file: ../../../examples/primates.fasta
    data_type: nucleotide

partitions:
  - id: gene1
    alignment_id: alignment1
    site_model:
      substitution_model:
        type: hky
        kappa: {value: 2.0, lower: 0.0, estimate: true}
        frequencies: {mode: estimated}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0, estimate: true}
    clock_model:
      type: ucln
      ucld_mean: {value: 0.01, lower: 0.0, estimate: true}
      ucld_stdev: {value: 0.2, lower: 0.0, estimate: true}

tree_prior:
  type: yule
  birth_rate: {value: 1.0, lower: 0.0, estimate: true}

calibrations:
  - name: "Catarrhini"
    taxa: [Homo_sapiens, Pan, Gorilla, Pongo, Hylobates, Macaca_fuscata, M_mulatta, M_fascicularis, M_sylvanus]
    monophyletic: true
    distribution:
      type: lognormal
      parameters: {mean: 1.0, stdev: 0.5}
      offset: 25.0
    provenance:
      source: fossil
      calibration_type: soft
      original_age_min: 25.0
      original_age_max: 30.0

mcmc:
  chain_length: 1000

loggers:
  trace_log: {file_name: beauti_ref_hky_gamma_ucln.log, log_every: 100}

control:
  beast_version: 1.10.4
  initial_tree: coalescent
