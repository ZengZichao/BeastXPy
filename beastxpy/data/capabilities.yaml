# BeastXPy capability manifest -- the single source of truth.
#
# `beastxpy capabilities`, the documentation pages and the tests all read this
# file.  Do not restate this table anywhere else; add rows here instead.
#
# status:
#   supported  BeastXPy generates the XML and the official BEAST jars accept it.
#   partial    Generated, but only within a documented subset, or only on one
#              of the two supported BEAST versions.
#   blocked    Cannot be produced at all; `reason` names the upstream defect.
#
# requires_native_beagle refers to *execution* (a real MCMC likelihood), not to
# XML generation or to java-core validation.  BEAGLE 3.1.0 pairs with BEAST
# 1.10.4 and BEAGLE 4.0.1 with BEAST X 10.5.0; on Windows pass
# --beagle-threads 1.
#
# A `supported` row is a statement about XML generation and official-parser
# acceptance only.  Unless a reason says otherwise, the evidence mode is
# `java-core`: the official BEAST parsers construct the document but the
# project TreeLikelihood shim stands in for the likelihood.  `--mode beagle`
# (native BEAGLE) is the only mode that exercises the full parser set and a
# real likelihood; cite that mode when claiming "official validation".
# It is not a claim that the model is appropriate for any particular data set,
# and nothing here is a convergence or model-selection statement.

schema_version: beastxpy.capabilities/v1
beast_versions:
  - "1.10.4"
  - "10.5.0"

