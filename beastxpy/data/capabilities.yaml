        reason: "Two independent upstream parser defects, rejected deliberately at Gate 0. (1) ConvertAlignmentParser's syntax rule rejects geneticCode (\"Unhandled attribute (typo?) geneticCode\"). (2) Without that attribute DataTypeUtils cannot resolve plain 'codon' because only 'codon-<geneticCode>' is registered, so BEAST 1.10.4 reports \"Incompatible alignment DataType\". The official testCodonLikelihood.xml fails identically. No legacy shim is enabled, and none is described as official BEAST support. Use srd06_codon instead."
      "10.5.0":
        status: blocked
        requires_native_beagle: true
        reason: "Same two upstream parser defects as BEAST 1.10.4, rejected deliberately at Gate 0. Here the missing 'codon' DataType surfaces as a NullPointerException in DataType.getDescription. The official testCodonLikelihood.xml fails identically. No legacy shim is enabled, and none is described as official BEAST support. Use srd06_codon instead."
    verify_command: >-
      python -m pytest tests/test_coverage_rejections.py::test_codon_is_rejected_due_to_upstream_parser_defect -q

  - id: arg_recombination
    name: Ancestral recombination graph (ARG) recombination
    category: analysis
    versions:
      "1.10.4":
        status: blocked
        requires_native_beagle: true
        reason: "The released <argTreeLikelihood> parser requires the legacy dr.oldevomodel.sitemodel.SiteModel object, but the released <siteModel> parser creates dr.evomodel.siteratemodel.GammaSiteRateModel. Separately, <argTreeModel> rejects <nodeRates> (\"Unexpected element in argTreeModel: nodeRates\") while <argEventOperator> requires that same node-rate compound, and the shipped arg-ecoli.xml fails identically. Both defects are upstream; supporting this would require a custom parser registration, which BeastXPy does not present as official behaviour. Gate 0 rejects the analysis."
      "10.5.0":
        status: blocked
        requires_native_beagle: true
        reason: "Identical upstream defects to BEAST 1.10.4: the legacy SiteModel requirement of <argTreeLikelihood> versus the GammaSiteRateModel that <siteModel> creates (\"Exactly one ELEMENT of type SiteModel REQUIRED\"), plus the <argTreeModel>/<nodeRates> versus <argEventOperator> conflict. The shipped arg-ecoli.xml fails identically. No custom parser registration is enabled by default. Gate 0 rejects the analysis."
    verify_command: >-
      python -m pytest tests/test_coverage_recomb_mds.py::test_recombination_is_rejected_with_upstream_reason -q

