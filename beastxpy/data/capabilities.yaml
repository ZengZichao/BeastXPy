  - id: nucleotide_substitution_models
    name: Nucleotide substitution models (JC69, HKY, TN93, GTR)
    category: substitution-model
    versions:
      "1.10.4":
        status: supported
        requires_native_beagle: true
        reason: "Generated; accepted by the official BEAST 1.10.4 parser set in java-core mode (project TreeLikelihood shim; construct-only, no likelihood evaluation). Full-parser, real-likelihood evidence needs --mode beagle with a native BEAGLE library."
      "10.5.0":
        status: supported
        requires_native_beagle: true
        reason: "Generated; accepted by the official BEAST X 10.5.0 parser set in java-core mode (project TreeLikelihood shim; construct-only, no likelihood evaluation). Full-parser, real-likelihood evidence needs --mode beagle with a native BEAGLE library."
    verify_command: >-
      python tools/official_validate.py --matrix "examples/config_*.yaml" --mode java-core

