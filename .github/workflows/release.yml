name: Release

# Tag-driven release: pushing a tag "vX.Y.Z" builds the distributions, runs a
# smoke check, publishes "beastxpy" to PyPI through trusted publishing, and
# attaches all distributions to a GitHub release (which Zenodo archives when
# the GitHub integration is enabled). Nothing runs on a developer machine.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that the tag matches the declared version
        run: python tools/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Build the jar-free core wheel
        run: python tools/build_core_wheel.py

      - name: Smoke check the wheel
        run: |
          python -m pip install dist/beastxpy-*.whl
          beastxpy --version
          beastxpy capabilities >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/
            dist-core/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: artifacts

      - name: Publish beastxpy to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/dist

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: artifacts

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist/beastxpy-*.tar.gz
            artifacts/dist/beastxpy-*.whl
            artifacts/dist-core/beastxpy_core-*.whl
          generate_release_notes: true
